<title>The Deal Room</title>
<style>
  :root{
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --ground:#0E1620; --surface:#16212D; --surface-2:#1E2E3C; --raise:#25384A;
    --line:#2C3E4E; --ink:#CAD6E0; --muted:#7E8D9B; --faint:#516070;
    --parchment:#E8DFC8; --parchment-2:#DED3B6; --parchment-ink:#2C2617; --parchment-line:#C3B591; --parchment-muted:#6C6146;
    --accent:#E2A94E; --accent-2:#F0C273; --accent-deep:#B9832F; --accent-ink:#1A1206;
    --peace:#57AE90; --peace-dim:#2E4F47; --war:#CC6A4B; --war-dim:#4E332A;
    --shadow:0 18px 44px -20px rgba(0,0,0,.7);
  }
  @media (prefers-color-scheme:light){:root{
    --ground:#DED9C9; --surface:#ECE7D8; --surface-2:#E4DDC9; --raise:#D9D0B8;
    --line:#CBC1A6; --ink:#2A2A26; --muted:#6D6858; --faint:#8B846F;
    --parchment:#F4EEDD; --parchment-2:#EAE1C8; --parchment-ink:#2C2617; --parchment-line:#CBBE97; --parchment-muted:#6C6146;
    --accent:#A9711B; --accent-2:#C08A2C; --accent-deep:#8A5A12; --accent-ink:#FBF3E0;
    --peace:#2F7A61; --peace-dim:#CBDDD3; --war:#B2532F; --war-dim:#E7D2C6; --shadow:0 16px 40px -22px rgba(60,48,20,.5);}}
  :root[data-theme="dark"]{
    --ground:#0E1620; --surface:#16212D; --surface-2:#1E2E3C; --raise:#25384A;
    --line:#2C3E4E; --ink:#CAD6E0; --muted:#7E8D9B; --faint:#516070;
    --parchment:#E8DFC8; --parchment-2:#DED3B6; --parchment-ink:#2C2617; --parchment-line:#C3B591; --parchment-muted:#6C6146;
    --accent:#E2A94E; --accent-2:#F0C273; --accent-deep:#B9832F; --accent-ink:#1A1206;
    --peace:#57AE90; --peace-dim:#2E4F47; --war:#CC6A4B; --war-dim:#4E332A; --shadow:0 18px 44px -20px rgba(0,0,0,.7);}
  :root[data-theme="light"]{
    --ground:#DED9C9; --surface:#ECE7D8; --surface-2:#E4DDC9; --raise:#D9D0B8;
    --line:#CBC1A6; --ink:#2A2A26; --muted:#6D6858; --faint:#8B846F;
    --parchment:#F4EEDD; --parchment-2:#EAE1C8; --parchment-ink:#2C2617; --parchment-line:#CBBE97; --parchment-muted:#6C6146;
    --accent:#A9711B; --accent-2:#C08A2C; --accent-deep:#8A5A12; --accent-ink:#FBF3E0;
    --peace:#2F7A61; --peace-dim:#CBDDD3; --war:#B2532F; --war-dim:#E7D2C6; --shadow:0 16px 40px -22px rgba(60,48,20,.5);}

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);line-height:1.5;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%);}
  .wrap{max-width:760px;margin:0 auto;padding:22px 20px 64px;min-height:100vh}
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
  .brand{font-family:var(--font-display);font-size:1.28rem;letter-spacing:.01em}
  .brand b{color:var(--accent);font-weight:700}
  .brand .sub{display:block;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:3px}
  .ctrls{display:flex;gap:8px;flex:none}
  .pill{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
  .pill:hover{color:var(--ink);border-color:var(--accent)}
  .pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rail{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
  .rail .cell{background:var(--surface);padding:9px 12px}
  .rail .k{font-family:var(--font-mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .rail .v{font-family:var(--font-mono);font-size:1.02rem;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--ink)}
  .rail .v.accent{color:var(--accent)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.15;margin:0}
  h1{font-size:2rem;letter-spacing:.005em}h2{font-size:1.35rem}
  .eyebrow{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-deep);margin:0 0 10px}
  :root[data-theme="dark"] .eyebrow{color:var(--accent)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .eyebrow{color:var(--accent)}}
  p{margin:.7em 0}.lede{font-size:1.06rem;color:var(--ink)}.muted{color:var(--muted)}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .btn{font-family:var(--font-ui);font-size:.98rem;font-weight:600;cursor:pointer;border-radius:10px;padding:13px 20px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);transition:transform .12s ease,border-color .12s ease,background .12s ease}
  .btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.ghost{background:transparent}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .cable{background:var(--parchment);color:var(--parchment-ink);border-radius:10px;padding:20px 22px;font-family:var(--font-display);position:relative;
    background-image:repeating-linear-gradient(var(--parchment) 0 26px, var(--parchment-2) 26px 27px);box-shadow:inset 0 0 0 1px var(--parchment-line), var(--shadow)}
  .cable .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--parchment-muted);border-bottom:1px solid var(--parchment-line);padding-bottom:8px;margin-bottom:12px}
  .cable .body{font-size:1.08rem;line-height:1.55}
  .cable .sig{margin-top:14px;font-style:italic;color:var(--parchment-muted);font-size:.95rem}
  .offerchip{display:inline-flex;align-items:baseline;gap:8px;margin-top:16px;background:color-mix(in srgb,var(--accent) 22%, var(--parchment));border:1px solid var(--accent-deep);border-radius:8px;padding:8px 14px;font-family:var(--font-mono);color:var(--parchment-ink)}
  .offerchip .n{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
  .offerchip .lab{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--parchment-muted)}
  .cliff{margin:20px 0 4px}
  .cliff .cap{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .gauge{position:relative;height:16px;border-radius:999px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(90deg,var(--war-dim),var(--surface-2) 46%,var(--surface-2) 54%,var(--peace-dim))}
  .gauge .thr{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent);left:28%}
  .gauge .needle{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px;left:0;transition:left .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 22%,transparent)}
  .cliff .read{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:9px;line-height:1.5}
  .cliff .read b{color:var(--ink)}
  .choices{display:grid;gap:12px;margin-top:18px}
  @media(min-width:560px){.choices.two{grid-template-columns:1fr 1fr}}
  .choice{text-align:left;display:flex;flex-direction:column;gap:4px;padding:16px 18px;align-items:flex-start}
  .choice .t{font-family:var(--font-display);font-size:1.12rem}
  .choice .pay{font-family:var(--font-mono);font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--muted)}
  .choice .pay b{color:var(--accent)}
  .choice .note{font-size:.82rem;color:var(--faint)}
  .reveal{text-align:center;padding:30px 22px}
  .verdict{font-family:var(--font-display);font-size:2.5rem;line-height:1;margin:6px 0 4px;text-wrap:balance}
  .verdict.peace{color:var(--peace)}.verdict.war{color:var(--war)}
  .seal{width:74px;height:74px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border:2px solid}
  .seal.peace{border-color:var(--peace);color:var(--peace);background:var(--peace-dim)}
  .seal.war{border-color:var(--war);color:var(--war);background:var(--war-dim)}
  .payline{font-family:var(--font-mono);font-size:1.5rem;font-variant-numeric:tabular-nums;margin:10px 0 2px}
  .payline .plus{color:var(--peace)}.payline .low{color:var(--war)}
  .rational{font-size:.9rem;color:var(--muted);max-width:52ch;margin:14px auto 0}
  .rational b{color:var(--ink)}
  .steps{display:flex;gap:6px;margin:0 0 20px;padding:0;list-style:none;flex-wrap:wrap}
  .steps li{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .steps li.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .rules{display:grid;gap:12px;margin:18px 0}
  .rule{display:flex;gap:14px;align-items:flex-start}
  .rule .num{font-family:var(--font-mono);color:var(--accent);font-size:.9rem;flex:none;width:22px;padding-top:2px}
  .rule .rt{font-size:.96rem}.rule .rt b{color:var(--ink)}
  .field{margin-top:16px}
  .field label{display:block;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  textarea,input[type=text]{width:100%;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--font-ui);font-size:.92rem;resize:vertical}
  textarea.data{font-family:var(--font-mono);font-size:.72rem;height:150px}
  .summ{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
  .summ .c{background:var(--surface-2);padding:14px 12px;text-align:center}
  .summ .n{font-family:var(--font-mono);font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--accent)}
  .summ .l{font-family:var(--font-mono);font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}
  .placard{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;padding:16px 18px;margin:18px 0}
  .placard .who{font-family:var(--font-display);font-size:1.25rem;color:var(--accent)}
  .hidden{display:none!important}
  .foot{margin-top:26px;font-size:.78rem;color:var(--faint);text-align:center;line-height:1.6}
  .agree{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:.95rem;cursor:pointer;color:var(--ink)}
  .agree input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
  .q{margin:18px 0}
  .q .qt{font-family:var(--font-display);font-size:1.06rem;margin-bottom:8px}
  .q .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;font-size:.92rem}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface-2))}
  .opt.bad{border-color:var(--war);background:var(--war-dim)}
  .opt input{accent-color:var(--accent);width:16px;height:16px;flex:none}
  .check-msg{min-height:1.3em;color:var(--war);font-size:.9rem;margin-top:4px}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .stage{animation:rise .34s ease both}
  @media(prefers-reduced-motion:reduce){.stage{animation:none}.needle{transition:none}}
</style>

<div class="wrap">
  <div class="masthead">
    <div class="brand"><b>The Deal Room</b><span class="sub" data-i18n="sub">—</span></div>
    <div class="ctrls">
      <button class="pill" id="langbtn" type="button">TR</button>
      <button class="pill" id="themebtn" type="button" data-i18n="theme">Theme</button>
    </div>
  </div>

  <div class="rail" id="rail">
    <div class="cell"><div class="k" data-i18n="rail.round">Round</div><div class="v" id="r-round">—</div></div>
    <div class="cell"><div class="k" data-i18n="rail.deposit">Deposit</div><div class="v accent" id="r-bond">—</div></div>
    <div class="cell"><div class="k" data-i18n="rail.score">Points</div><div class="v" id="r-score">0</div></div>
  </div>

  <section class="panel stage" id="s-consent">
    <p class="eyebrow" data-i18n="consent.eyebrow">—</p>
    <h1 data-i18n="consent.h">—</h1>
    <p class="lede" data-i18n="consent.body">—</p>
    <label class="agree"><input type="checkbox" id="agree"/> <span data-i18n="consent.agree">—</span></label>
    <div class="btn-row"><button class="btn primary" id="go-intro" type="button" disabled data-i18n="consent.cta">—</button></div>
  </section>

  <section class="panel stage hidden" id="s-intro">
    <p class="eyebrow" data-i18n="intro.eyebrow">—</p>
    <h1 data-i18n="intro.h1">—</h1>
    <p class="lede" data-i18n="intro.lede">—</p>
    <p class="muted" data-i18n="intro.note">—</p>
    <div class="btn-row"><button class="btn primary" id="go-rules" type="button" data-i18n="intro.cta">—</button></div>
  </section>

  <section class="panel stage hidden" id="s-rules">
    <p class="eyebrow" data-i18n="rules.eyebrow">—</p>
    <h2 data-i18n="rules.h2">—</h2>
    <div class="rules">
      <div class="rule"><div class="num">1</div><div class="rt" data-i18n="rules.r1">—</div></div>
      <div class="rule"><div class="num">2</div><div class="rt" data-i18n="rules.r2">—</div></div>
      <div class="rule"><div class="num">3</div><div class="rt" data-i18n="rules.r3">—</div></div>
    </div>
    <p class="muted" data-i18n="rules.bond">—</p>
    <div class="btn-row">
      <button class="btn primary" id="go-play" type="button" data-i18n="rules.cta">—</button>
      <button class="btn ghost" id="back-intro" type="button" data-i18n="rules.back">—</button>
    </div>
  </section>

  <section class="panel stage hidden" id="s-check">
    <p class="eyebrow" data-i18n="check.eyebrow">—</p>
    <h2 data-i18n="check.h">—</h2>
    <p class="muted" data-i18n="check.intro">—</p>
    <div id="quiz"></div>
    <p class="check-msg" id="check-msg"></p>
    <div class="btn-row">
      <button class="btn primary" id="go-check" type="button" data-i18n="check.cta">—</button>
      <button class="btn ghost" id="back-rules2" type="button" data-i18n="rules.back">—</button>
    </div>
  </section>

  <section class="panel stage hidden" id="s-dispatch">
    <ul class="steps"><li class="on" data-i18n="step.dispatch">—</li><li data-i18n="step.move">—</li><li data-i18n="step.outcome">—</li></ul>
    <div class="cable">
      <div class="hd"><span data-i18n="disp.cablehd">—</span><span id="d-tag">—</span></div>
      <div class="body" id="d-body">…</div>
      <div class="sig" id="d-sig">—</div>
      <div class="offerchip"><span class="n" id="d-offer">50</span><span class="lab" data-i18n="disp.offerlab">—</span></div>
    </div>
    <div class="cliff">
      <div class="cap"><span data-i18n="cliff.left">—</span><span data-i18n="cliff.right">—</span></div>
      <div class="gauge"><div class="thr"></div><div class="needle" id="needle"></div></div>
      <div class="read" id="cliff-read">—</div>
    </div>
    <div class="btn-row"><button class="btn primary" id="go-decide" type="button" data-i18n="disp.cta">—</button></div>
  </section>

  <section class="panel stage hidden" id="s-t1">
    <ul class="steps"><li data-i18n="step.dispatch">—</li><li class="on" data-i18n="step.move">—</li><li data-i18n="step.outcome">—</li></ul>
    <p class="eyebrow" data-i18n="t1.eyebrow">—</p>
    <h2 id="t1-q">—</h2>
    <div class="choices two">
      <button class="btn choice" id="c-accept" type="button">
        <span class="t" data-i18n="t1.acceptT">—</span><span class="pay" data-i18n="t1.acceptP">—</span><span class="note" data-i18n="t1.acceptN">—</span></button>
      <button class="btn choice" id="c-reject" type="button">
        <span class="t" data-i18n="t1.rejectT">—</span><span class="pay" data-i18n="t1.rejectP">—</span><span class="note" data-i18n="t1.rejectN">—</span></button>
    </div>
  </section>

  <section class="panel stage hidden" id="s-t2">
    <ul class="steps"><li data-i18n="step.dispatch">—</li><li class="on" data-i18n="step.move">—</li><li data-i18n="step.outcome">—</li></ul>
    <p class="eyebrow" data-i18n="t2.eyebrow">—</p>
    <h2 data-i18n="t2.h2">—</h2>
    <div class="choices two">
      <button class="btn choice" id="c-honor" type="button">
        <span class="t" data-i18n="t2.honorT">—</span><span class="pay" id="p-honor">—</span><span class="note" data-i18n="t2.honorN">—</span></button>
      <button class="btn choice" id="c-attack" type="button">
        <span class="t" data-i18n="t2.attackT">—</span><span class="pay" id="p-attack">—</span><span class="note" id="attack-note">—</span></button>
    </div>
    <div class="field"><label for="msg" data-i18n="t2.msglabel">—</label><input type="text" id="msg" maxlength="140"/></div>
  </section>

  <section class="panel stage hidden" id="s-reveal">
    <ul class="steps"><li data-i18n="step.dispatch">—</li><li data-i18n="step.move">—</li><li class="on" data-i18n="step.outcome">—</li></ul>
    <div class="reveal">
      <div class="seal" id="rv-seal">—</div>
      <div class="verdict" id="rv-verdict">—</div>
      <div class="payline" id="rv-pay">—</div>
      <p class="rational" id="rv-rational">—</p>
    </div>
    <div class="btn-row" style="justify-content:center"><button class="btn primary" id="go-next" type="button">—</button></div>
  </section>

  <section class="panel stage hidden" id="s-end">
    <p class="eyebrow" data-i18n="end.eyebrow">—</p>
    <h2 data-i18n="end.h2">—</h2>
    <div class="summ">
      <div class="c"><div class="n" id="e-score">0</div><div class="l" data-i18n="end.totalL">—</div></div>
      <div class="c"><div class="n" id="e-peace">0</div><div class="l" data-i18n="end.peaceL">—</div></div>
      <div class="c"><div class="n" id="e-ata">0%</div><div class="l" data-i18n="end.ataL">—</div></div>
    </div>
    <div class="placard"><div class="who" id="e-who">—</div><p class="muted" id="e-who-note" style="margin:.4em 0 0">—</p></div>
    <p class="muted" id="e-cliff">—</p>
    <p class="muted" data-i18n="end.debrief">—</p>
    <div class="field"><label for="data" data-i18n="end.dataL">—</label><textarea class="data" id="data" readonly></textarea></div>
    <div class="btn-row">
      <button class="btn primary" id="copy" type="button" data-i18n="end.copy">—</button>
      <button class="btn ghost" id="again" type="button" data-i18n="end.again">—</button>
    </div>
    <div class="foot" data-i18n="end.foot">—</div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var PIE=100, WAR=40, GRAB=62, BSTAR=0.12;

  var T={
    en:{
      sub:"A short negotiation game", theme:"Theme",
      "rail.round":"Round","rail.deposit":"Deposit","rail.score":"Points",
      "intro.eyebrow":"A negotiation game",
      "intro.h1":"You represent Borvane.",

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function honorPay(c){return Math.round(c.offer*PIE);}
  function attackPay(c){return Math.round(GRAB-c.bond*PIE);}
  function needlePct(c){return Math.max(4,Math.min(96,8+(c.bond/0.50)*84));}

  function renderStatic(){var d=T[L];
    document.querySelectorAll("[data-i18n]").forEach(function(el){var k=el.getAttribute("data-i18n");if(d[k]!=null)el.innerHTML=d[k];});
    $("langbtn").textContent=(L==="en")?"TR":"EN";

    document.documentElement.setAttribute("lang",L);
  }
  function fillDispatch(){var d=T[L];
    $("r-round").textContent=(idx+1)+" / "+order.length;
    $("r-bond").textContent=cur.bond>0?Math.round(cur.bond*PIE):0;
    $("d-tag").textContent=d.tag(cur);
    $("d-body").textContent=cur[L].body;
    $("d-sig").textContent=cur[L].sig;
    $("d-offer").textContent=Math.round(cur.offer*PIE);
    $("needle").style.left=needlePct(cur)+"%";
    $("cliff-read").innerHTML=d.cliffRead(cur);
  }
  function fillT1(){$("t1-q").textContent=T[L].t1q(Math.round(cur.offer*PIE));}
  function fillT2(){var d=T[L];
    $("p-honor").innerHTML=d.honorPay(honorPay(cur));
    $("p-attack").innerHTML=d.attackPay(attackPay(cur));
    $("attack-note").textContent=d.attackNote(Math.round(cur.bond*PIE));
  }
  function fillReveal(){if(!reveal)return;var d=T[L];var peace=(reveal.o==="peace");
    var seal=$("rv-seal"),verd=$("rv-verdict");
    seal.className="seal "+(peace?"peace":"war");seal.textContent=d.seal(peace);
    verd.className="verdict "+(peace?"peace":"war");verd.textContent=d.verdict(reveal.o);
    $("rv-pay").innerHTML=d.pay(reveal.pts);
    $("rv-rational").innerHTML=d.rational(reveal.o,reveal.c,reveal.hp,reveal.ap);
    $("go-next").textContent=d.next(reveal.last);
  }

  }
  function fillCheck(){var q=T[L].quiz,html="";
    for(var i=0;i<q.length;i++){html+='<div class="q" data-qi="'+i+'"><div class="qt">'+(i+1)+'. '+q[i].q+'</div><div class="opts">';
      for(var j=0;j<q[i].opts.length;j++){html+='<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"/> <span>'+q[i].opts[j]+'</span></label>';}
      html+='</div></div>';}
    $("quiz").innerHTML=html;$("check-msg").textContent="";
    $("quiz").querySelectorAll("input[type=radio]").forEach(function(inp){inp.onchange=function(){
      inp.closest(".opts").querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel","bad");});
      inp.closest(".opt").classList.add("sel");};});
  }
  function checkAnswers(){var q=T[L].quiz,ok=true;
    for(var i=0;i<q.length;i++){var sel=$("quiz").querySelector("input[name=q"+i+"]:checked");
      if(!sel||parseInt(sel.value,10)!==q[i].c){ok=false;if(sel)sel.closest(".opt").classList.add("bad");}}

  function repaint(){
    if(screen==="s-check")fillCheck();

  function startRound(){cur=order[idx];reveal=null;fillDispatch();show("s-dispatch");}
  function finish(o){var pts;
    if(o==="war_now")pts=WAR;else if(o==="peace")pts=honorPay(cur);else pts=attackPay(cur);
    score+=pts;$("r-score").textContent=score;
    log.push({round:idx+1,protocol:cur.proto,deposit_points:Math.round(cur.bond*PIE),offer_x:cur.offer,
      t1:(o==="war_now"?"reject":"accept"),t2:(o==="war_now"?null:(o==="attack_t2"?"attack":"honor")),
      outcome:o,points:pts,message:($("msg").value||"").slice(0,140)});
    reveal={o:o,pts:pts,c:cur,hp:honorPay(cur),ap:attackPay(cur),last:(idx+1>=order.length)};
    fillReveal();show("s-reveal");
  }
  function endGame(){
    var acc=log.filter(function(r){return r.t1==="accept"&&r.deposit_points>0;});
    var atk=acc.filter(function(r){return r.t2==="attack";});
    var below=log.filter(function(r){return r.deposit_points>0&&r.deposit_points<BSTAR*PIE&&r.t1==="accept";});
    var above=log.filter(function(r){return r.deposit_points>=BSTAR*PIE;});
    ended={score:score,peaceN:log.filter(function(r){return r.outcome==="peace";}).length,
      ata:acc.length?Math.round(100*atk.length/acc.length):0,
      ah:above.filter(function(r){return r.outcome==="peace";}).length,an:above.length,
      bs:below.filter(function(r){return r.t2==="attack";}).length,bn:below.length};
    fillEnd();show("s-end");
  }
  function newGame(){order=shuffle(DECK.slice());idx=0;score=0;log=[];ended=null;$("r-score").textContent="0";startRound();}

  $("agree").onchange=function(){$("go-intro").disabled=!this.checked;};
  $("go-intro").onclick=function(){show("s-intro");};
  $("go-rules").onclick=function(){show("s-rules");};
  $("back-intro").onclick=function(){show("s-intro");};
  $("go-play").onclick=function(){fillCheck();show("s-check");};
  $("go-check").onclick=checkAnswers;
  $("back-rules2").onclick=function(){show("s-rules");};
  $("go-decide").onclick=function(){fillT1();show("s-t1");};
  $("c-accept").onclick=function(){fillT2();show("s-t2");};
  $("c-reject").onclick=function(){finish("war_now");};
  $("c-honor").onclick=function(){finish("peace");};
  $("c-attack").onclick=function(){finish("attack_t2");};
  $("go-next").onclick=function(){idx++;if(idx<order.length)startRound();else endGame();};
  $("again").onclick=newGame;
  $("copy").onclick=function(){var t=$("data");t.select();try{document.execCommand("copy");}catch(e){}
    if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(function(){});
    $("copy").textContent=T[L].copied;setTimeout(function(){$("copy").textContent=T[L]["end.copy"];},1400);};
  $("langbtn").onclick=function(){L=(L==="en")?"tr":"en";renderStatic();repaint();};
  $("themebtn").onclick=function(){var c=document.documentElement.getAttribute("data-theme");var mql=window.matchMedia("(prefers-color-scheme:dark)");
    document.documentElement.setAttribute("data-theme",c?(c==="dark"?"light":"dark"):(mql.matches?"light":"dark"));};

  renderStatic();
  $("rail").classList.add("hidden");
})();
</script>
